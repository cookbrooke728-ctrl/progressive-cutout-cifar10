[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutout-lab"
version = "1.0.0"
description = "Auditable CIFAR-10 Cutout and progressive-probability reproduction"
requires-python = ">=3.10"
dependencies = ["torch==2.8.0", "torchvision==0.23.0", "numpy==2.1.3", "matplotlib==3.10.0"]

[project.scripts]
cutout-lab = "cutout_lab.cli:main"

[tool.setuptools.packages.find]
include = ["cutout_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
